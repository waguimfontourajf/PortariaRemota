# Portaria Remota - VirtualHost do Apache
#
# Laragon: salve como  C:\laragon\etc\apache2\sites-enabled\portariaremota.conf
# XAMPP:   cole no fim de C:\xampp\apache\conf\extra\httpd-vhosts.conf
#
# Ajuste o caminho abaixo para a pasta onde o projeto foi clonado.
# O DocumentRoot DEVE ser a pasta "public" (nunca a raiz do projeto).

<VirtualHost *:80>
    ServerName portariaremota.meusistema.api.br
    DocumentRoot "C:/laragon/www/portariaremota/public"

    <Directory "C:/laragon/www/portariaremota/public">
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    ErrorLog "logs/portariaremota-error.log"
    CustomLog "logs/portariaremota-access.log" common
</VirtualHost>
